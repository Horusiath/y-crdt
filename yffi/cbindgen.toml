#endif
"""

[parse]
parse_deps = false

[export]
exclude = ["Doc", "Node", "UndoManager"]

[export.rename]
"Doc" = "YDoc"
"Node" = "YNode"
"UndoManager" = "YUndoManager"
"Transaction" = "YTransaction"
